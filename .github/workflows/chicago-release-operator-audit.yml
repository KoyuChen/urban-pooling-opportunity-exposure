name: chicago-release-operator-audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - code/ai_pilot/data_pipeline/production_audit/live_chicago_release_operator_audit.py
      - code/ai_pilot/data_pipeline/production_audit/tests/test_live_chicago_release_operator_audit.py
      - code/ai_pilot/data_pipeline/chicago_release_adapter.py
      - code/ai_pilot/data_pipeline/tests/test_chicago_release_adapter.py
      - code/ai_pilot/bounds/release_operator_compiler.py
      - code/ai_pilot/bounds/tests/test_release_operator_compiler.py
      - .github/workflows/chicago-release-operator-audit.yml

concurrency:
  group: chicago-release-operator-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact audit dependencies
        run: |
          python -m pip install \
            numpy==2.3.5 \
            scipy==1.17.0
      - name: Run release-operator and bridge tests
        run: |
          python -m unittest discover \
            -s code/ai_pilot/data_pipeline/production_audit/tests \
            -p 'test_live_chicago_release_operator_audit.py' -v
          python -m unittest discover \
            -s code/ai_pilot/data_pipeline/tests \
            -p 'test_chicago_release_adapter.py' -v
          python -m unittest discover \
            -s code/ai_pilot/bounds/tests \
            -p 'test_release_operator_compiler.py' -v

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact audit dependencies
        run: |
          python -m pip install \
            numpy==2.3.5 \
            scipy==1.17.0
      - name: Audit the live public release operator and identification boundary
        run: |
          python \
            code/ai_pilot/data_pipeline/production_audit/live_chicago_release_operator_audit.py \
            --output-dir tmp/chicago-release-operator-audit \
            --core-start 2026-01-13T17:30:00 \
            --page-size 1000 \
            --max-candidate-rows 5000 \
            --max-contributor-rows 100000 \
            --request-timeout 90 \
            --request-attempts 3 \
            --solver-time-limit 60
      - name: Enforce the fail-closed claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "tmp/chicago-release-operator-audit/release_operator_audit.json"
              ).read_text(encoding="utf-8")
          )
          assert report["report_version"] == "chicago-release-operator-live-audit/v2"
          assert report["overall_status"] == "PARTIAL_DOCUMENTED_PUBLIC_CONSISTENCY"
          assert report["documentation"]["city_implementation_validated"] is False
          assert report["documentation"]["converse_licensed"] is False
          assert report["documentation"]["low_literals_emitted"] == 0
          assert report["extraction"]["candidate_count_closed"] is True
          assert report["extraction"]["all_public_contributors_count_closed"] is True
          assert report["extraction"]["candidate_null_start_or_end_rows"] == 0

          masks = report["release_masks"]
          assert masks["mask_equalities_scope"] == "SNAPSHOT_SUBSET_DESCRIPTIVE_ONLY"
          assert masks["chicago_release_rule_inferred_from_mask_equality"] is False
          assert masks["blank_cause_identified_from_public_release"] is False
          assert masks["blank_to_low_inversion_permitted"] is False
          assert masks["centroid_null_implies_outside_chicago"] is False
          assert masks["centroid_null_licenses_finite_radius_exclusion"] is False

          graph = report["released_time_envelope_graph_sensitivity"]
          assert graph["positive_length_outer_released_time_envelope_graph_cover_status"] == "OPTIMAL_NUMERICAL_MILP"
          assert graph["alternative_positive_length_outer_released_time_envelope_graph_cover_status"] == "OPTIMAL_NUMERICAL_MILP"
          assert graph["outer_released_time_envelope_graph_core_cover_multiplicity_status"] == "CERTIFIED_TWO_DISTINCT_CORE_COVERS_IN_POSITIVE_LENGTH_OUTER_RELEASED_TIME_ENVELOPE_GRAPH"
          assert graph["conditional_on_positive_length_outer_released_time_envelope_graph"] is True
          assert graph["cores_changed_between_displayed_covers"] == report["extraction"]["core_rows"]
          assert graph["spatially_unmeasured_core_incidences_min_status_over_graph_covers"] == "OPTIMAL_NUMERICAL_MILP"
          assert graph["spatially_unmeasured_core_incidences_max_status_over_graph_covers"] == "OPTIMAL_NUMERICAL_MILP"
          assert graph["max_certified_mip_gap"] <= 1e-9
          assert graph["max_certified_replay_residual"] <= 1e-9
          assert graph["positive_length_outer_released_time_envelope_intersection_edge_count"] + graph["outer_released_time_envelope_boundary_touch_only_edge_count"] == graph["closed_outer_released_time_envelope_intersection_edge_count"]

          boundary = report["identification_boundary"]
          assert boundary["partner_recovery_status"] == "NOT_RECOVERED_FROM_PUBLIC_ROWS"
          assert boundary["cohort_partner_identification_status"] == "NOT_ADJUDICATED_NO_FULL_WORLD_CERTIFICATE"
          assert boundary["cohort_partner_nonidentification_certified"] is False
          assert boundary["full_hidden_worlds_constructed"] is False
          assert boundary["shared_exact_timestamp_witness_constructed"] is False
          assert boundary["remaining_buffer_run_completion_constructed"] is False
          assert boundary["hidden_run_closure"] == "NOT_CONSTRUCTED_AND_NOT_CLAIMED"
          assert boundary["hidden_partner_identification_claim"] == "NONE"

          abstraction = report["documented_release_map_abstraction"]
          assert abstraction["scope"] == "ABSTRACT_FOUR_ROW_CONSTRUCTION_NOT_COHORT_COMPLETION"
          assert abstraction["same_documented_public_release"] is True
          assert abstraction["documented_public_field_map_invariant_to_witness_linkage_swap"] is True
          assert abstraction["full_city_implementation_validated"] is False
          assert abstraction["applies_to_observed_cohort"] is False
          assert abstraction["linked_to_displayed_graph_covers"] is False
          assert abstraction["cohort_partner_nonidentification_certified"] is False

          support = report["candidate_support_consequence"]
          assert support["release_prunable_unmeasured_edges"] == 0
          assert support["finite_radius_policy"] == "RETAIN_ALL_SPATIALLY_UNMEASURED_EDGES"
          assert support["measured_centroid_radius_classification"] == "ANALYST_CANDIDATE_SUPPORT_SENSITIVITY_NOT_NECESSARY_COMPATIBILITY"
          PY
      - name: Upload aggregate release-operator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-release-operator-audit
          path: tmp/chicago-release-operator-audit
          if-no-files-found: warn
          retention-days: 90
