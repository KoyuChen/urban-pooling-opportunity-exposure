name: selective-disclosure-exploration

on:
  push:
    branches:
      - explore-selective-disclosure-20260904
    paths:
      - .github/workflows/selective-disclosure-exploration.yml

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_pilot/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r code/ai_pilot/requirements.txt
      - name: Run exact selective-disclosure exploration
        run: |
          python - <<'PY'
          import itertools
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "code/ai_pilot/benchmarks")
          import selective_disclosure_benchmark as benchmark

          # The row-usage interface has only eight atoms. Complete subset
          # enumeration is much faster than starting thousands of tiny MILPs;
          # pair certificates continue to use the exact MILP implementation.
          def fast_usage_certificate(
              feasible_masks,
              true_mask,
              values,
              q,
              threshold,
              buffer_positions,
          ):
              true_decision = benchmark._decision(
                  true_mask, values, q, threshold
              )
              opposite = [
                  mask
                  for mask in feasible_masks
                  if benchmark._decision(mask, values, q, threshold)
                  != true_decision
              ]
              if not opposite:
                  return {
                      "ambiguous_before_disclosure": False,
                      "opposite_world_count": 0,
                      "minimum_certificate_size": 0,
                      "fixed_support_upper_bound": 0,
                  }
              disagreement = benchmark._inclusion_minimal_sets(
                  frozenset(
                      position
                      for position in buffer_positions
                      if bool(true_mask & (1 << position))
                      != bool(mask & (1 << position))
                  )
                  for mask in opposite
              )
              chosen_size = None
              for size in range(1, len(buffer_positions) + 1):
                  if any(
                      all(set(chosen) & set(item) for item in disagreement)
                      for chosen in itertools.combinations(buffer_positions, size)
                  ):
                      chosen_size = size
                      break
              if chosen_size is None:
                  raise AssertionError("usage certificate search failed")
              selected = sum(
                  bool(true_mask & (1 << position))
                  for position in buffer_positions
              )
              upper = min(selected, len(buffer_positions) - selected)
              if chosen_size > upper:
                  raise AssertionError("usage certificate exceeded fixed-q bound")
              return {
                  "ambiguous_before_disclosure": True,
                  "opposite_world_count": len(opposite),
                  "minimum_certificate_size": chosen_size,
                  "fixed_support_upper_bound": upper,
              }

          benchmark.minimum_usage_certificate = fast_usage_certificate
          report = benchmark.run(
              instances_per_capacity=1000,
              adaptive_instances_per_capacity=200,
              partition_instances_per_capacity=100,
              base_seed=20260902,
          )
          usage = report["usage_certificates"]
          assert usage["comparison_count"] == 9000
          assert usage["ambiguous_comparison_count"] == 5954
          assert usage["conditional_minimum_certificate"]["median"] == 1
          assert usage["conditional_minimum_certificate"]["p90"] == 3
          assert usage["conditional_minimum_certificate"]["maximum"] == 4
          partition = report["partition_certificates"]
          assert partition["instance_count"] == 300
          assert partition["conditional_minimum_pair_certificate"]["maximum"] <= 3

          output = Path("tmp/selective-disclosure")
          output.mkdir(parents=True, exist_ok=True)
          compact = {
              key: value
              for key, value in report.items()
              if key not in {"usage_cells", "adaptive_cells", "partition_cells"}
          }
          (output / "report.json").write_text(
              json.dumps(compact, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (output / "REPORT.md").write_text(
              benchmark.render(report),
              encoding="utf-8",
          )
          print(benchmark.render(report))
          PY
      - name: Upload aggregate exploration evidence
        uses: actions/upload-artifact@v4
        with:
          name: selective-disclosure-exploration
          path: tmp/selective-disclosure
          retention-days: 90
