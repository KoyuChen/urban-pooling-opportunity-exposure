name: selective-disclosure-cg-exploration

on:
  push:
    branches:
      - explore-selective-disclosure-20260904
    paths:
      - .github/workflows/selective-disclosure-cg-exploration.yml

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_pilot/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r code/ai_pilot/requirements.txt
      - name: Run exact constraint-generation audit
        run: |
          python code/ai_pilot/benchmarks/selective_disclosure_constraint_generation.py \
            --usage-instances-per-capacity 100 \
            --pair-instances-per-capacity 30 \
            --base-seed 20260902 \
            --output-dir tmp/selective-disclosure-cg
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path("tmp/selective-disclosure-cg/report.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["usage_summary"]["cell_count"] == 900
          assert report["usage_summary"]["exact_agreement_count"] == 900
          assert report["pair_summary"]["cell_count"] == 90
          assert report["pair_summary"]["exact_agreement_count"] == 90
          PY
      - name: Upload aggregate exploration evidence
        uses: actions/upload-artifact@v4
        with:
          name: selective-disclosure-cg-exploration
          path: tmp/selective-disclosure-cg
          retention-days: 90
