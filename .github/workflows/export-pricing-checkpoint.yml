name: export-pricing-checkpoint
on:
  push:
    branches: [improve-disclosure-pricing-20260905]
    paths: [.github/workflows/export-pricing-checkpoint.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23963d5dfb6600a20bf63a773a410ac200bf711b
      - run: git archive --format=zip --output="$RUNNER_TEMP/pricing-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pricing-source-checkpoint
          path: ${{ runner.temp }}/pricing-source.zip
          retention-days: 7
