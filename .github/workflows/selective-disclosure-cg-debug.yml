name: selective-disclosure-cg-debug

on:
  push:
    branches:
      - explore-selective-disclosure-20260904
    paths:
      - .github/workflows/selective-disclosure-cg-debug.yml

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_pilot/requirements.txt
      - run: python -m pip install -r code/ai_pilot/requirements.txt
      - name: Reproduce fixed separation seed
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "code/ai_pilot/benchmarks")
          import numpy as np
          from scipy.optimize import Bounds, LinearConstraint, milp
          import event_frontier_truth_benchmark as canonical
          import event_frontier_truth_benchmark_scale as scaled
          import selective_disclosure_benchmark as explicit
          import selective_disclosure_constraint_generation as cg

          seed = 24260968
          capacity = 4
          threshold = 0.25
          instance = scaled.generate_instance(seed, capacity)
          master = canonical.base.exact.build_master(instance.rows, capacity, epsilon=0.1)
          true_mask = explicit._member_mask(instance.true_buffer_indices)
          q = true_mask.bit_count()
          values = explicit._buffer_values(master)
          masks = tuple(mask for mask in master.reachable_buffer_masks if mask.bit_count() == q)
          print({
              "seed": seed,
              "capacity": capacity,
              "q": q,
              "column_count": len(master.columns),
              "fixed_q_mask_count": len(masks),
              "true_decision": explicit._decision(true_mask, values, q, threshold),
              "explicit_size": cg.explicit_usage_size(masks, true_mask, values, q, threshold, explicit._buffer_positions(master)),
          })

          columns = tuple(master.columns)
          rows = []
          lower = []
          upper = []
          for i in cg.positions(master.all_core_mask, len(master.rows)):
              rows.append(np.asarray([bool(c.member_mask & (1 << i)) for c in columns], dtype=float))
              lower.append(1.0); upper.append(1.0)
          for i in cg.positions(master.all_buffer_mask, len(master.rows)):
              rows.append(np.asarray([bool(c.member_mask & (1 << i)) for c in columns], dtype=float))
              lower.append(0.0); upper.append(1.0)
          rows.append(np.asarray([c.buffer_mask.bit_count() for c in columns], dtype=float))
          lower.append(float(q)); upper.append(float(q))
          objective = np.asarray([
              sum(value for i, value in values.items() if c.buffer_mask & (1 << i))
              for c in columns
          ], dtype=float)
          result = milp(
              c=objective,
              integrality=np.ones(len(columns), dtype=int),
              bounds=Bounds(np.zeros(len(columns)), np.ones(len(columns))),
              constraints=LinearConstraint(np.vstack(rows), np.asarray(lower), np.asarray(upper)),
              options={"time_limit": 30.0, "mip_rel_gap": 0.0},
          )
          print({
              "success": bool(result.success),
              "status": int(result.status),
              "message": str(result.message),
              "fun": None if result.fun is None else float(result.fun),
              "x_is_none": result.x is None,
              "mip_gap": getattr(result, "mip_gap", None),
              "mip_node_count": getattr(result, "mip_node_count", None),
              "mip_dual_bound": getattr(result, "mip_dual_bound", None),
          })
          print("wrapper", cg.usage_separation(master, values, q, threshold, true_mask, ()))
          PY
