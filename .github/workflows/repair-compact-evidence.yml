              text = text.replace(old, new, 1)
          old = '''          python code/ai_pilot/benchmarks/selective_disclosure_constraint_generation.py \\
            --self-test
'''
          new = '''          python code/ai_pilot/benchmarks/selective_disclosure_constraint_generation.py \\
