          expected="$(printf 'chicago-live-audits.yml\\nci.yml\\n')"
          test "$actual" = "$expected"
'''
          if 'actual="$(find .github/workflows' not in text:
              if old not in text:
                  raise AssertionError('CI self-test anchor missing')
              text = text.replace(old, new, 1)
          ci.write_text(text)
