name: repair-compact-evidence

on:
  push:
    branches:
      - repair-compact-evidence-20260905
    paths:
      - .github/workflows/repair-compact-evidence.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-compact-evidence-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r code/ai_pilot/requirements.txt
      - name: Repair integration and run compact self-test
        run: |
          python scripts/repair_compact_integration.py
          python scripts/repair_compact_json.py
          python -m py_compile \
            code/ai_pilot/data_pipeline/production_audit/compact_event_slot_probe.py \
            code/ai_pilot/data_pipeline/production_audit/ordered_run_disclosure_separator.py \
            code/ai_pilot/benchmarks/compact_event_slot_audit.py
          python code/ai_pilot/benchmarks/compact_event_slot_audit.py --self-test
      - name: Run frozen paired audit
        run: |
          rm -rf tmp/compact-event-slot-audit
          python code/ai_pilot/benchmarks/compact_event_slot_audit.py \
            --output-dir tmp/compact-event-slot-audit
      - name: Freeze evidence and synchronize documentation
        run: python scripts/finalize_compact_evidence.py
      - name: Remove all one-off compact workflows and temporary scripts
        run: |
          rm -f \
            .github/workflows/apply-compact-event-slot-probe.yml \
            .github/workflows/apply-compact-probe.yml \
            .github/workflows/export-compact-probe-source.yml \
            .github/workflows/finalize-compact-event-slot-probe.yml \
            .github/workflows/finalize-compact-probe-docs.yml \
            .github/workflows/run-compact-event-slot-audit.yml \
            .github/workflows/verify-and-mark-compact-probe.yml \
            .github/workflows/repair-compact-evidence.yml \
            scripts/repair_compact_integration.py \
            scripts/repair_compact_json.py \
            scripts/finalize_compact_evidence.py
      - name: Verify and package the final tree
        run: |
          python -m py_compile \
            code/ai_pilot/data_pipeline/production_audit/compact_event_slot_probe.py \
            code/ai_pilot/data_pipeline/production_audit/ordered_run_disclosure_separator.py \
            code/ai_pilot/benchmarks/compact_event_slot_audit.py \
            code/ai_pilot/benchmarks/check_compact_event_slot_evidence.py
          python code/ai_pilot/benchmarks/compact_event_slot_audit.py --self-test
          python code/ai_pilot/benchmarks/check_compact_event_slot_evidence.py
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf 'chicago-live-audits.yml\nci.yml\n')"
          tar --exclude=.git --exclude=tmp -czf "$RUNNER_TEMP/compact-repair-final-tree.tar.gz" .
      - name: Upload verified final tree
        uses: actions/upload-artifact@v4
        with:
          name: compact-repair-final-tree
          path: ${{ runner.temp }}/compact-repair-final-tree.tar.gz
          retention-days: 7
