name: selective-disclosure-recovery-gap

on:
  push:
    branches:
      - explore-selective-disclosure-20260904
    paths:
      - .github/workflows/selective-disclosure-recovery-gap.yml

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_pilot/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r code/ai_pilot/requirements.txt
      - name: Run exact decision-versus-recovery comparison
        run: |
          python code/ai_pilot/benchmarks/selective_disclosure_recovery_gap.py \
            --usage-instances-per-capacity 1000 \
            --partition-instances-per-capacity 100 \
            --base-seed 20260902 \
            --output-dir tmp/selective-disclosure-recovery-gap
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path("tmp/selective-disclosure-recovery-gap/report.json")
              .read_text(encoding="utf-8")
          )
          assert report["usage_summary"]["comparison_count"] == 9000
          assert report["partition_summary"]["instance_count"] == 300
          assert report["usage_summary"]["strict_savings_rate"] > 0.0
          assert report["partition_summary"]["strict_savings_rate"] > 0.0
          PY
      - name: Upload aggregate exploration evidence
        uses: actions/upload-artifact@v4
        with:
          name: selective-disclosure-recovery-gap
          path: tmp/selective-disclosure-recovery-gap
          retention-days: 90
