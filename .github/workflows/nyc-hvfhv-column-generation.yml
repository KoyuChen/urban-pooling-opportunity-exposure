name: nyc-hvfhv-column-generation

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the live NYC fixed-time decomposition audits
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - code/ai_pilot/data_pipeline/production_audit/ordered_run_column_generation.py
      - code/ai_pilot/data_pipeline/production_audit/ordered_run_branch_and_price.py
      - code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_column_generation_smoke.py
      - code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_branch_and_price_smoke.py
      - code/ai_pilot/data_pipeline/production_audit/NYC_ORDERED_RUN_COLUMN_GENERATION.md
      - code/ai_pilot/data_pipeline/production_audit/NYC_ORDERED_RUN_BRANCH_AND_PRICE.md
      - code/ai_pilot/data_pipeline/production_audit/tests/test_ordered_run_column_generation.py
      - code/ai_pilot/benchmarks/relation_incomplete_event_benchmark.py
      - code/ai_pilot/benchmarks/event_frontier_truth_benchmark.py
      - .github/workflows/nyc-hvfhv-column-generation.yml

concurrency:
  group: nyc-hvfhv-column-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Audit pricing, integer branching, and truth-benchmark invariants
        run: |
          python code/ai_pilot/data_pipeline/production_audit/ordered_run_column_generation.py
          python code/ai_pilot/data_pipeline/production_audit/ordered_run_branch_and_price.py
          python code/ai_pilot/benchmarks/event_frontier_truth_benchmark.py --self-test
          python -m unittest discover \
            -s code/ai_pilot/data_pipeline/production_audit/tests \
            -p 'test_ordered_run_column_generation.py' -v

  truth-benchmark:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run point-reconstruction and candidate-recall benchmark
        run: |
          python code/ai_pilot/benchmarks/event_frontier_truth_benchmark.py \
            --instances-per-capacity 250 \
            --base-seed 20260902 \
            --output-dir tmp/event-frontier-truth-benchmark
      - name: Upload truth-based benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-frontier-truth-benchmark
          path: tmp/event-frontier-truth-benchmark
          if-no-files-found: warn
          retention-days: 90

  live-lp:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_live) }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Compare generated and complete LP masters on one public cohort
        shell: bash
        run: |
          output="tmp/nyc-hvfhv-column-generation"
          mkdir -p "${output}"
          status=1
          for retry in 1 2 3; do
            echo "Live column-generation audit attempt ${retry}"
            rm -f "${output}/report.json" "${output}/REPORT.md" \
              "${output}/column_generation_cells.csv"
            set +e
            python code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_column_generation_smoke.py \
              --output-dir "${output}" \
              --scan-start 2023-01-03T17:00:00 \
              --scan-end 2023-01-03T21:00:00 \
              --existential-core 4 \
              --existential-buffers 12 \
              --overlap-epsilon-seconds 1.0 \
              2>&1 | tee "${output}/run-attempt-${retry}.log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ ${status} -eq 0 ]]; then
              break
            fi
            sleep $((20 * retry))
          done
          exit ${status}
      - name: Upload aggregate LP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-hvfhv-column-generation
          path: tmp/nyc-hvfhv-column-generation
          if-no-files-found: warn
          retention-days: 90

  live-integer:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_live) }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Certify the exact integer masters by branch-and-price
        shell: bash
        run: |
          output="tmp/nyc-hvfhv-branch-and-price"
          mkdir -p "${output}"
          status=1
          for retry in 1 2; do
            echo "Live branch-and-price audit attempt ${retry}"
            rm -f "${output}/report.json" "${output}/REPORT.md" \
              "${output}/branch_and_price_cells.csv"
            set +e
            python code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_branch_and_price_smoke.py \
              --output-dir "${output}" \
              --scan-start 2023-01-03T17:00:00 \
              --scan-end 2023-01-03T21:00:00 \
              --existential-core 4 \
              --existential-buffers 12 \
              --overlap-epsilon-seconds 1.0 \
              --bp-max-nodes 5000 \
              --bp-time-limit-seconds 900 \
              2>&1 | tee "${output}/run-attempt-${retry}.log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ ${status} -eq 0 ]]; then
              break
            fi
            sleep $((20 * retry))
          done
          exit ${status}
      - name: Upload aggregate integer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-hvfhv-branch-and-price
          path: tmp/nyc-hvfhv-branch-and-price
          if-no-files-found: warn
          retention-days: 90
