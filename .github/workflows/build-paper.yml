name: build-paper

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  method-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_pilot/requirements-ci.txt
      - name: Install method dependencies
        run: python -m pip install -r code/ai_pilot/requirements-ci.txt
      - name: Run exact and adversarial unit checks
        run: |
          python -m unittest discover -s code/ai_pilot/bounds/tests -v
          python -m unittest discover -s code/ai_pilot/data_pipeline/tests -v
          python -m unittest discover \
            -s code/ai_pilot/data_pipeline/production_audit/tests -v
          python -m unittest discover -s code/ai_pilot/external_benchmarks/tests -v
          python -m unittest discover \
            -s code/ai_pilot/benchmarks/runtime_profile -p 'test_*.py' -v
          python adversarial_review/counterexamples.py
      - name: Reproduce locked solver audits
        run: |
          python code/ai_pilot/benchmarks/path_frontier_benchmark.py \
            --output-dir "$RUNNER_TEMP/path-frontier"
          python code/ai_pilot/benchmarks/joint_solver_audit.py \
            --output "$RUNNER_TEMP/joint-solver-audit.json"
          python code/ai_pilot/benchmarks/exact_conformal_frontier.py \
            --output-dir "$RUNNER_TEMP/exact-conformal" \
            --reference-json code/ai_pilot/benchmarks/results/conformal_matching/conformal_matching_benchmark.json
          python code/ai_pilot/benchmarks/component_frontier_benchmark.py \
            --output-dir "$RUNNER_TEMP/component-frontier"
          python -c 'import json,sys; key="canonical_evidence_sha256"; generated=json.load(open(sys.argv[1], encoding="utf-8"))[key]; committed=json.load(open(sys.argv[2], encoding="utf-8"))[key]; assert generated == committed, (generated, committed)' \
            "$RUNNER_TEMP/component-frontier/component_frontier_benchmark.json" \
            code/ai_pilot/benchmarks/results/component_frontier/component_frontier_benchmark.json
      - name: Run bounded capacity smoke profile
        run: |
          python code/ai_pilot/benchmarks/runtime_profile/temporal_frontier_profile.py \
            --output-dir "$RUNNER_TEMP/runtime-profile" \
            --case-timeout-seconds 10 \
            --max-frontier-records 200000 \
            --case-id records_n010 \
            --case-id factors_overlap03 \
            --case-id labels_d04

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile ACM paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Check KDD main-paper boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          cp paper/main.pdf paper/KDD_Research_Working_Draft.pdf
          ./scripts/check_submission_pdf.sh paper/KDD_Research_Working_Draft.pdf
      - name: Upload compiled draft
        uses: actions/upload-artifact@v4
        with:
          name: kdd-research-working-draft
          path: paper/KDD_Research_Working_Draft.pdf
