name: nyc-hvfhv-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_smoke.py
      - .github/workflows/nyc-hvfhv-smoke.yml

concurrency:
  group: nyc-hvfhv-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DuckDB
        run: python -m pip install duckdb==1.4.1
      - name: Query official TLC HVFHV parquet
        run: |
          python code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_smoke.py \
            --output-dir tmp/nyc-hvfhv-smoke \
            --min-core 20 --max-core 200 --max-padding-minutes 30
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-hvfhv-smoke
          path: tmp/nyc-hvfhv-smoke
          if-no-files-found: warn
          retention-days: 90
