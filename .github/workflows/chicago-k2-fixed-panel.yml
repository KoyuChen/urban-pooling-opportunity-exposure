name: chicago-k2-fixed-panel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the frozen 96-window follow-up or revisit the closed pilot recovery"
        required: true
        default: "followup"
        type: choice
        options: [followup, pilot-recovery]
      resume_run_id:
        description: "Prior checkpoint run; leave empty only for follow-up batch 0"
        required: false
        default: ""
        type: string
      batch_index:
        description: "Frozen follow-up batch, in order"
        required: true
        default: "0"
        type: choice
        options: ["0", "1", "2", "3", "4", "5", "6", "7"]
      continue_campaign:
        description: "Continue through batch 7; at most two transport-only retries per batch"
        type: boolean
        default: false
      retry_attempt:
        description: "Bounded continuation retry index"
        type: choice
        options: ["0", "1", "2"]
        default: "0"
      expected_seed_sha256:
        description: "Checkpoint digest supplied by the preceding verified batch"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/chicago-k2-fixed-panel.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: chicago-k2-fixed-panel
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'pilot-recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      retry_count: ${{ steps.plan.outputs.retry_count }}
    env:
      SOURCE_RUN: ${{ inputs.resume_run_id || '34178831936' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source run
        run: |
          python - <<'PY'
          import os
          assert os.environ['SOURCE_RUN'].isdigit(), 'source run must be numeric'
          PY
      - name: Restore original cohort artifacts
        if: env.SOURCE_RUN == '34048658431'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: cohort_*
          path: tmp/chicago-seed
      - name: Restore a subsequent complete checkpoint
        if: env.SOURCE_RUN != '34048658431'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: chicago-k2-panel-checkpoint
          path: tmp/chicago-seed
      - name: Merge committed completed retries still absent from the source
        if: env.SOURCE_RUN != '34048658431'
        run: |
          python - <<'PY'
          import json, shutil, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'code/ai_pilot/data_pipeline/production_audit')
          import resume_chicago_k2_fixed_panel as resume
          root = Path('tmp/chicago-seed')
          committed = Path('code/ai_pilot/data_pipeline/results/chicago_k2_fixed_panel/local_retry_20260907')
          resume.verify_checkpoint(json.loads((root / 'checkpoint.json').read_text()),
                                   root, resume.panel.DEFAULT_PROTOCOL)
          resume.verify_checkpoint(json.loads((committed / 'checkpoint.json').read_text()),
                                   committed, resume.panel.DEFAULT_PROTOCOL)
          allowed = {item['slug'] for item in
                     resume.recovery_plan(root, resume.panel.DEFAULT_PROTOCOL)['retry_windows']}
          with tempfile.TemporaryDirectory() as temporary:
              stage = Path(temporary)
              applied = []
              for source in committed.glob('cohort_*'):
                  if source.name in allowed:
                      shutil.copytree(source, stage / source.name)
                      applied.append(source.name)
              if applied:
                  resume.merge(root, stage, resume.panel.DEFAULT_PROTOCOL, {
                      'committed_retry_checkpoint': committed.as_posix(),
                      'applied_cohorts': sorted(applied),
                  })
          print(json.dumps({'committed_retries_applied': sorted(applied)}))
          PY
      - name: Verify checkpoint and select only transport retries
        id: plan
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'code/ai_pilot/data_pipeline/production_audit')
          import resume_chicago_k2_fixed_panel as resume
          manifest = (Path('code/ai_pilot/data_pipeline/results/chicago_k2_fixed_panel/INITIAL_CHECKPOINT.json')
                      if os.environ['SOURCE_RUN'] == '34048658431'
                      else Path('tmp/chicago-seed/checkpoint.json'))
          plan = resume.prepare(Path('tmp/chicago-seed'), manifest,
                                Path('tmp/chicago-prepared'), resume.panel.DEFAULT_PROTOCOL)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps(plan['matrix'], separators=(',', ':')), file=output)
              print('retry_count=' + str(len(plan['retry_windows'])), file=output)
          print(json.dumps(plan, indent=2))
          PY
      - name: Preserve the verified starting checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: chicago-k2-prepared-checkpoint
          path: tmp/chicago-prepared
          if-no-files-found: error
          retention-days: 90

  cohorts:
    needs: prepare
    if: needs.prepare.outputs.retry_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8
      - name: Verify panel protocol and driver
        run: |
          python code/ai_pilot/data_pipeline/production_audit/run_chicago_k2_fixed_panel.py --self-test
      - name: Retry one originally declared transport-failed cohort
        run: |
          python code/ai_pilot/data_pipeline/production_audit/run_chicago_k2_fixed_panel.py \
            --window-index ${{ matrix.index }} \
            --indexed-count-transport \
            --output-dir tmp/chicago-retries
      - name: Upload fail-closed retry record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: tmp/chicago-retries/${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [prepare, cohorts]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: chicago-k2-prepared-checkpoint
          path: tmp/chicago-k2-fixed-panel
      - name: Restore available retry records
        if: needs.prepare.outputs.retry_count != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: cohort_*
          path: tmp/chicago-retries
      - name: Preserve earlier attempts and rebuild the complete panel
        env:
          RETRY_RUN: ${{ github.run_id }}
        run: |
          python code/ai_pilot/data_pipeline/production_audit/resume_chicago_k2_fixed_panel.py \
            --output-dir tmp/chicago-k2-fixed-panel \
            --merge-dir tmp/chicago-retries \
            --source-run-id "$RETRY_RUN"
      - name: Upload complete recoverable checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-k2-panel-checkpoint
          path: tmp/chicago-k2-fixed-panel
          if-no-files-found: error
          retention-days: 90
      - name: Upload panel summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-k2-fixed-panel-summary
          path: |
            tmp/chicago-k2-fixed-panel/panel_report.json
            tmp/chicago-k2-fixed-panel/panel_windows.csv
            tmp/chicago-k2-fixed-panel/PANEL_REPORT.md
            tmp/chicago-k2-fixed-panel/recovery_plan.json
          if-no-files-found: error
          retention-days: 90

  followup-prepare:
    # Explicit completion launch; ordinary edits do not start a campaign.
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[chicago-followup-complete]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'followup') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selected_count: ${{ steps.plan.outputs.selected_count }}
      indices: ${{ steps.plan.outputs.indices }}
    env:
      BATCH_INDEX: ${{ github.event_name == 'push' && '3' || inputs.batch_index || '0' }}
      RESUME_RUN: ${{ github.event_name == 'push' && '34549243865' || inputs.resume_run_id }}
      EXPECTED_SEED_SHA256: ${{ github.event_name == 'push' && 'ca1b939c8d28ad5d2e01cb58a1dc03b0526bd43159c865e268b41a2172256816' || inputs.expected_seed_sha256 || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore prior follow-up checkpoint when advancing or retrying
        if: env.RESUME_RUN != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RESUME_RUN }}
          name: chicago-k2-followup-checkpoint
          path: tmp/chicago-k2-followup
      - name: Verify the pinned predecessor checkpoint
        if: env.EXPECTED_SEED_SHA256 != ''
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          checkpoint = Path('tmp/chicago-k2-followup/checkpoint.json')
          assert hashlib.sha256(checkpoint.read_bytes()).hexdigest() == os.environ['EXPECTED_SEED_SHA256'], 'launch checkpoint hash mismatch'
          assert 0 <= int(os.environ['BATCH_INDEX']) < 8
          assert os.environ['RESUME_RUN'].isdigit()
          PY
      - name: Initialize only the first batch when no checkpoint is supplied
        if: env.RESUME_RUN == ''
        run: |
          test "$BATCH_INDEX" = "0"
          python code/ai_pilot/data_pipeline/production_audit/chicago_k2_followup.py \
            --checkpoint-dir tmp/chicago-k2-followup --initialize
      - name: Verify sequential gate and choose only this fixed batch
        id: plan
        run: |
          python code/ai_pilot/data_pipeline/production_audit/chicago_k2_followup.py \
            --checkpoint-dir tmp/chicago-k2-followup --batch-index "$BATCH_INDEX" \
            --plan-output "$RUNNER_TEMP/followup-plan.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'followup-plan.json').read_text())
          indices = [item['index'] for item in plan['selected_windows']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps(plan['matrix'], separators=(',', ':')), file=output)
              print('selected_count=' + str(len(indices)), file=output)
              print('indices=' + json.dumps(indices, separators=(',', ':')), file=output)
          PY
      - name: Preserve verified pre-batch checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: chicago-k2-followup-prepared
          path: tmp/chicago-k2-followup
          if-no-files-found: error
          retention-days: 90

  followup-cohorts:
    needs: followup-prepare
    if: needs.followup-prepare.outputs.selected_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.followup-prepare.outputs.matrix) }}
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8
      - name: Run one predeclared follow-up cohort
        run: |
          python code/ai_pilot/data_pipeline/production_audit/run_chicago_k2_fixed_panel.py \
            --protocol code/ai_pilot/data_pipeline/production_audit/CHICAGO_K2_FOLLOWUP_PROTOCOL.json \
            --window-index "${{ matrix.index }}" --indexed-count-transport \
            --output-dir tmp/chicago-k2-followup-attempts
      - name: Upload the complete fail-closed attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: tmp/chicago-k2-followup-attempts/${{ matrix.slug }}
          if-no-files-found: warn
          retention-days: 90

  followup-aggregate:
    needs: [followup-prepare, followup-cohorts]
    if: ${{ always() && needs.followup-prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: chicago-k2-followup-prepared
          path: tmp/chicago-k2-followup
      - name: Restore every available attempt artifact
        if: needs.followup-prepare.outputs.selected_count != '0'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: cohort_*
          path: tmp/chicago-k2-followup-attempts
      - name: Merge terminal records and preserve missing-artifact failures
        env:
          EXPECTED_INDICES: ${{ needs.followup-prepare.outputs.indices }}
        run: |
          python code/ai_pilot/data_pipeline/production_audit/chicago_k2_followup.py \
            --checkpoint-dir tmp/chicago-k2-followup \
            --merge-dir tmp/chicago-k2-followup-attempts \
            --expected-indices-json "$EXPECTED_INDICES" --source-run "${{ github.run_id }}"
      - name: Upload recoverable 96-window checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-k2-followup-checkpoint
          path: tmp/chicago-k2-followup
          if-no-files-found: error
          retention-days: 90
      - name: Upload aggregate ledger and TeX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-k2-followup-summary
          path: |
            tmp/chicago-k2-followup/followup_report.json
            tmp/chicago-k2-followup/followup_windows.csv
            tmp/chicago-k2-followup/FOLLOWUP_REPORT.md
            tmp/chicago-k2-followup/FOLLOWUP_RESULTS.tex
          if-no-files-found: error
          retention-days: 90

  followup-continue:
    needs: followup-aggregate
    if: ${{ needs.followup-aggregate.result == 'success' && github.run_attempt == 1 && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[chicago-followup-complete]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'followup' && inputs.continue_campaign)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      BATCH_INDEX: ${{ github.event_name == 'push' && '3' || inputs.batch_index }}
      RETRY_ATTEMPT: ${{ inputs.retry_attempt || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: chicago-k2-followup-checkpoint
          path: tmp/chicago-k2-followup
      - name: Verify evidence and plan one bounded continuation
        run: |
          python code/ai_pilot/data_pipeline/production_audit/advance_chicago_followup.py \
            --checkpoint-dir tmp/chicago-k2-followup --batch-index "$BATCH_INDEX" \
            --retry-attempt "$RETRY_ATTEMPT" --output tmp/continuation.json
      - name: Preserve continuation decision before dispatch
        uses: actions/upload-artifact@v4
        with:
          name: chicago-k2-continuation-decision
          path: tmp/continuation.json
          if-no-files-found: error
          retention-days: 90
      - name: Dispatch the verified next batch or stop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          plan = json.loads(Path('tmp/continuation.json').read_text())
          if plan['action'] != 'DISPATCH':
              print(json.dumps(plan, sort_keys=True))
              if plan['reason'] != 'CALENDAR_EXECUTION_COMPLETE':
                  raise SystemExit('Continuation stopped for diagnosis: ' + plan['reason'])
              raise SystemExit(0)
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'Content-Type': 'application/json'}
          request = urllib.request.Request(base + '/commits/main', headers=headers)
          with urllib.request.urlopen(request, timeout=60) as response:
              head = json.load(response)['sha']
          if head != os.environ['GITHUB_SHA']:
              raise SystemExit('Source revision changed; refusing automatic continuation')
          payload = {'ref': 'main', 'inputs': {
              'mode': 'followup', 'resume_run_id': os.environ['GITHUB_RUN_ID'],
              'batch_index': str(plan['batch_index']),
              'retry_attempt': str(plan['retry_attempt']),
              'continue_campaign': 'true',
              'expected_seed_sha256': plan['checkpoint_sha256']}}
          request = urllib.request.Request(
              base + '/actions/workflows/chicago-k2-fixed-panel.yml/dispatches',
              data=json.dumps(payload).encode(), headers=headers, method='POST')
          # Do not retry an ambiguous POST: that could create duplicate runs.
          with urllib.request.urlopen(request, timeout=60) as response:
              if response.status != 204:
                  raise SystemExit('Unexpected dispatch response')
          print(json.dumps({'dispatch_accepted': True, 'inputs': payload['inputs']}))
          PY
