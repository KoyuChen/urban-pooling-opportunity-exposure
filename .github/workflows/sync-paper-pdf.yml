name: sync-paper-pdf

on:
  push:
    branches:
      - real-data-smoke-20260901
    paths:
      - paper/main.tex
      - paper/sections/**
      - paper/references.bib
      - .github/workflows/sync-paper-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-paper-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Compile superseding manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Check KDD main-paper boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          cp paper/main.pdf paper/KDD_Research_Working_Draft.pdf
          ./scripts/check_submission_pdf.sh paper/KDD_Research_Working_Draft.pdf
      - name: Commit compiled PDF when changed
        shell: bash
        run: |
          if git diff --quiet -- paper/KDD_Research_Working_Draft.pdf; then
            echo "Compiled PDF is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/KDD_Research_Working_Draft.pdf
          git commit -m "Sync compiled superseding KDD draft [skip pdf sync]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
