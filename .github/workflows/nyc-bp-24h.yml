name: nyc-bp-24h

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/nyc-bp-24h.yml

permissions:
  contents: read

jobs:
  open-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: 10
            capacity: 4
          - core: 12
            capacity: 4
          - core: 16
            capacity: 3
          - core: 16
            capacity: 4
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_pilot/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r code/ai_pilot/requirements.txt
      - name: Run one frozen open cell
        run: |
          python code/ai_pilot/data_pipeline/production_audit/run_nyc_branch_price_scale.py \
            --output-dir "tmp/core${{ matrix.core }}-capacity${{ matrix.capacity }}" \
            --window-label jan_weekday_evening_24h_followup \
            --scan-start 2023-01-03T17:00:00 \
            --scan-end 2023-01-03T21:00:00 \
            --ordered-core "${{ matrix.core }}" \
            --capacities "${{ matrix.capacity }}" \
            --solver-time-limit 20700 \
            --bp-max-nodes 1000000 \
            --bp-max-pricing-cases 65536
      - name: Upload fail-closed cell record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-bp-core${{ matrix.core }}-capacity${{ matrix.capacity }}
          path: tmp/core${{ matrix.core }}-capacity${{ matrix.capacity }}/
          if-no-files-found: warn
          retention-days: 30
