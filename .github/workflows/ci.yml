name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_pilot/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r code/ai_pilot/requirements.txt
      - name: Check active entrypoints
        run: |
          python -m py_compile \
            code/ai_pilot/benchmarks/relation_incomplete_event_benchmark.py \
            code/ai_pilot/benchmarks/event_frontier_truth_benchmark.py \
            code/ai_pilot/benchmarks/event_frontier_truth_benchmark_scale.py \
            code/ai_pilot/data_pipeline/production_audit/live_chicago_release_operator_audit_partitioned.py
          python \
            code/ai_pilot/data_pipeline/production_audit/live_chicago_k2_frontier_boundary.py \
            --self-test
      - name: Run production-audit tests
        run: |
          python -m unittest discover \
            -s code/ai_pilot/data_pipeline/production_audit/tests -v
      - name: Run controlled-truth self-test
        run: |
          python code/ai_pilot/benchmarks/event_frontier_truth_benchmark_scale.py \
            --self-test

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile ACM paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Check KDD main-paper boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          cp paper/main.pdf "$RUNNER_TEMP/KDD_Research_Working_Draft.pdf"
          ./scripts/check_submission_pdf.sh \
            "$RUNNER_TEMP/KDD_Research_Working_Draft.pdf"
      - name: Upload compiled draft
        uses: actions/upload-artifact@v4
        with:
          name: kdd-research-working-draft
          path: ${{ runner.temp }}/KDD_Research_Working_Draft.pdf
          retention-days: 90
