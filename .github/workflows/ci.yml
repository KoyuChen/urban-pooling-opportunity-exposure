name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_pilot/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r code/ai_pilot/requirements.txt
      - name: Check active entrypoints
        run: |
          python -m py_compile \
            code/ai_pilot/benchmarks/relation_incomplete_event_benchmark.py \
            code/ai_pilot/benchmarks/event_frontier_truth_benchmark.py \
            code/ai_pilot/benchmarks/event_frontier_truth_benchmark_scale.py \
            code/ai_pilot/benchmarks/selective_disclosure_benchmark.py \
            code/ai_pilot/benchmarks/selective_disclosure_constraint_generation.py \
            code/ai_pilot/benchmarks/compact_event_slot_audit.py \
            code/ai_pilot/benchmarks/check_compact_event_slot_evidence.py \
            code/ai_pilot/data_pipeline/production_audit/compact_event_slot_probe.py \
            code/ai_pilot/data_pipeline/production_audit/live_chicago_release_operator_audit_partitioned.py
          python \
            code/ai_pilot/data_pipeline/production_audit/live_chicago_k2_frontier_boundary.py \
            --self-test
      - name: Run production-audit tests
        run: |
          python -m unittest discover \
            -s code/ai_pilot/data_pipeline/production_audit/tests -v
      - name: Run controlled-truth self-test
        run: |
          python code/ai_pilot/benchmarks/event_frontier_truth_benchmark_scale.py \
            --self-test
      - name: Run selective-disclosure self-tests
        run: |
          python code/ai_pilot/benchmarks/selective_disclosure_benchmark.py \
            --self-test
          python code/ai_pilot/benchmarks/selective_disclosure_constraint_generation.py \
            --self-test
          python code/ai_pilot/benchmarks/compact_event_slot_audit.py --self-test
          python code/ai_pilot/benchmarks/check_compact_event_slot_evidence.py
          actual="$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)"
          expected="$(printf 'chicago-live-audits.yml\nci.yml\n')"
          test "$actual" = "$expected"
      - name: Audit frozen headline evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("code/ai_pilot/data_pipeline/results")
          nyc = root / "nyc_hvfhv"

          panel = json.loads(
              (nyc / "ORDERED_DECISION_PANEL_SUMMARY.json").read_text(
                  encoding="utf-8"
              )
          )
          assert panel["predeclared_window_count"] == 24
          assert panel["observed_report_count"] == 24
          assert panel["eligible_window_count"] == 21
          assert panel["ineligible_window_count"] == 3
          assert panel["technical_failure_count"] == 0
          assert panel["missing_report_count"] == 0
          assert panel["outcome_cell_count"] == 126
          assert panel["exact_outcome_cell_count"] == 101
          assert panel["certified_ambiguous_cell_count"] == 125
          assert panel["baseline_decision_disagreement_cell_count"] == 24
          assert panel["total_point_decisions"] == 498
          assert (
              panel["point_decisions_made_inside_certified_ambiguous_cells"]
              == 494
          )
          assert panel["manuscript_gate_pass"] is True

          scale = json.loads(
              (nyc / "BRANCH_AND_PRICE_SCALE_MANIFEST.json").read_text(
                  encoding="utf-8"
              )
          )
          summary = scale["summary"]
          assert scale["design"]["predeclared_cell_count"] == 18
          assert summary["completed_cell_count"] == 18
          assert summary["integer_optimum_certified_count"] == 14
          assert summary["bounded_unresolved_count"] == 4
          assert summary["skipped_insufficient_public_rows_count"] == 0
          assert [cell["absolute_gap"] for cell in summary["open_cells"]] == [
              3,
              4,
              1,
              3,
          ]

          chicago = json.loads(
              (
                  root
                  / "chicago_release_operator_audit"
                  / "release_operator_audit.json"
              ).read_text(encoding="utf-8")
          )
          extraction = chicago["extraction"]
          graph = chicago["released_time_envelope_graph_sensitivity"]
          boundary = chicago["identification_boundary"]
          assert chicago["overall_status"] == (
              "PARTIAL_DOCUMENTED_PUBLIC_CONSISTENCY"
          )
          assert extraction["core_rows"] == 60
          assert extraction["candidate_rows"] == 611
          assert extraction["all_trip_release_cell_contributor_rows"] == 50405
          assert extraction["candidate_count_closed"] is True
          assert extraction["all_public_contributors_count_closed"] is True
          assert extraction["broad_or_query_used"] is False
          assert extraction["full_row_cross_column_range_query_used"] is False
          assert graph[
              "positive_length_outer_released_time_envelope_intersection_edge_count"
          ] == 18462
          assert graph["cores_changed_between_displayed_covers"] == 60
          assert graph["max_certified_mip_gap"] == 0.0
          assert graph["max_certified_replay_residual"] == 0.0
          assert boundary["hidden_partner_identification_claim"] == "NONE"
          assert boundary["full_hidden_worlds_constructed"] is False

          superseded = [
              nyc / "BRANCH_AND_PRICE_REPORT.md",
              nyc / "EXISTENTIAL_PANEL_REPORT.md",
              nyc / "ORDERED_RUN_REPORT.md",
              nyc / "ORDERED_OUTCOME_REPORT.md",
          ]
          assert not any(path.exists() for path in superseded)
          print("frozen headline evidence audit: PASS")
          PY

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile ACM paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Check KDD main-paper boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          cp paper/main.pdf "$RUNNER_TEMP/KDD_Research_Working_Draft.pdf"
          ./scripts/check_submission_pdf.sh \
            "$RUNNER_TEMP/KDD_Research_Working_Draft.pdf"
      - name: Upload compiled draft
        uses: actions/upload-artifact@v4
        with:
          name: kdd-research-working-draft
          path: ${{ runner.temp }}/KDD_Research_Working_Draft.pdf
          retention-days: 90