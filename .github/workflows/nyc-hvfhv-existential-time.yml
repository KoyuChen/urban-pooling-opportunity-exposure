name: nyc-hvfhv-existential-time

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the live NYC existential timestamp-completion Gate
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - code/ai_pilot/data_pipeline/production_audit/ordered_run_existential_time.py
      - code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_existential_time.py
      - code/ai_pilot/data_pipeline/production_audit/NYC_EXISTENTIAL_TIME_MODEL.md
      - .github/workflows/nyc-hvfhv-existential-time.yml

concurrency:
  group: nyc-hvfhv-existential-time-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Test continuous-time existential run formulation
        run: |
          python code/ai_pilot/data_pipeline/production_audit/ordered_run_existential_time.py
          python code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_existential_time.py --self-test

  live:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_live) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Build exact-versus-existential-coarse timestamp frontiers
        shell: bash
        run: |
          mkdir -p tmp/nyc-hvfhv-existential-time
          set +e
          python code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_existential_time.py \
            --output-dir tmp/nyc-hvfhv-existential-time \
            --scan-start 2023-01-03T17:00:00 \
            --scan-end 2023-01-04T01:00:00 \
            --existential-core 4 \
            --existential-buffers 12 \
            --common-buffers-per-core 1.0 \
            --overlap-epsilon-seconds 1.0 \
            --solver-time-limit 45 \
            --require-all-certified \
            2>&1 | tee tmp/nyc-hvfhv-existential-time/run.log
          status=${PIPESTATUS[0]}
          exit ${status}
      - name: Upload aggregate existential-time evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-hvfhv-existential-time
          path: tmp/nyc-hvfhv-existential-time
          if-no-files-found: warn
          retention-days: 90
