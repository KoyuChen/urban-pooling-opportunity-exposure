name: nyc-bp-cache-replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/nyc-bp-cache-replay.yml

permissions:
  contents: read

jobs:
  paired-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: 10
            capacity: 4
            first: baseline
          - core: 12
            capacity: 4
            first: accelerated
          - core: 16
            capacity: 3
            first: baseline
          - core: 16
            capacity: 4
            first: accelerated
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_pilot/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r code/ai_pilot/requirements.txt
      - name: Reconstruct and run cache pair
        run: |
          python code/ai_pilot/data_pipeline/production_audit/nyc_branch_price_cache_replay.py \
            --output-dir "tmp/cell-${{ matrix.core }}-${{ matrix.capacity }}" \
            --target-core "${{ matrix.core }}" \
            --capacity "${{ matrix.capacity }}" \
            --first "${{ matrix.first }}" \
            --solver-time-limit 9000 \
            --bp-max-nodes 1000000 \
            --bp-max-pricing-cases 65536
      - name: Upload fail-closed paired record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-bp-cache-${{ matrix.core }}-${{ matrix.capacity }}
          path: tmp/cell-${{ matrix.core }}-${{ matrix.capacity }}/
          if-no-files-found: warn
          retention-days: 90

  summary:
    if: ${{ always() }}
    needs: paired-cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download every paired record
        uses: actions/download-artifact@v4
        with:
          pattern: nyc-bp-cache-*
          path: tmp/paired-records
      - name: Aggregate only after all four exact pairs close
        run: |
          python code/ai_pilot/data_pipeline/production_audit/nyc_branch_price_cache_replay.py \
            --aggregate-input-dir tmp/paired-records \
            --output-dir tmp/summary
      - name: Upload summary and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-bp-cache-summary
          path: tmp/summary/
          if-no-files-found: warn
          retention-days: 90
