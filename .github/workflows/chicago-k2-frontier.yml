name: chicago-k2-frontier

on:
  workflow_dispatch:
  pull_request:
    paths:
      - code/ai_pilot/data_pipeline/production_audit/live_chicago_k2_frontier.py
      - code/ai_pilot/data_pipeline/production_audit/tests/test_live_chicago_k2_frontier.py
      - .github/workflows/chicago-k2-frontier.yml

concurrency:
  group: chicago-k2-frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontier dependencies
        run: |
          python -m pip install \
            numpy==2.3.5 \
            scipy==1.17.0 \
            matplotlib==3.10.8
      - name: Run deterministic frontier checks
        run: |
          python \
            code/ai_pilot/data_pipeline/production_audit/live_chicago_k2_frontier.py \
            --self-test
          python -m unittest \
            code/ai_pilot/data_pipeline/production_audit/tests/test_live_chicago_k2_frontier.py \
            -v

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontier dependencies
        run: |
          python -m pip install \
            numpy==2.3.5 \
            scipy==1.17.0 \
            matplotlib==3.10.8
      - name: Build boundary-closed K=2 cohort and sensitivity curves
        run: |
          python \
            code/ai_pilot/data_pipeline/production_audit/live_chicago_k2_frontier.py \
            --output-dir tmp/chicago-k2-frontier \
            --scan-start 2026-01-13T17:00:00 \
            --scan-end 2026-01-13T21:00:00 \
            --min-core-rows 12 \
            --max-core-rows 60 \
            --max-candidate-rows 5000 \
            --page-size 5000 \
            --base-radius-km 2 \
            --solver-time-limit 20
      - name: Upload aggregate frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-k2-frontier
          path: tmp/chicago-k2-frontier
          if-no-files-found: warn
          retention-days: 90
