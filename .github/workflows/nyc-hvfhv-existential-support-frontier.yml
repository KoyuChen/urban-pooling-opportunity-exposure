name: nyc-hvfhv-existential-support-frontier

on:
  workflow_dispatch:
  pull_request:
    paths:
      - code/ai_pilot/data_pipeline/production_audit/ordered_run_fixed_time_master.py
      - code/ai_pilot/data_pipeline/production_audit/ordered_run_existential_time.py
      - code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_existential_time.py
      - code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_existential_time_hybrid.py
      - code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_existential_support_frontier.py
      - .github/workflows/nyc-hvfhv-existential-support-frontier.yml

concurrency:
  group: nyc-hvfhv-existential-support-frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Test exact column master and frontier wrapper
        run: |
          python code/ai_pilot/data_pipeline/production_audit/ordered_run_fixed_time_master.py
          python code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_existential_support_frontier.py --self-test

  live:
    strategy:
      fail-fast: false
      matrix:
        capacity: [2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Enumerate exact support and solve coarse existential support
        shell: bash
        run: |
          output="tmp/nyc-existential-support-C${{ matrix.capacity }}"
          mkdir -p "${output}"
          set +e
          python code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_existential_support_frontier.py \
            --output-dir "${output}" \
            --scan-start 2023-01-03T17:00:00 \
            --scan-end 2023-01-04T01:00:00 \
            --existential-core 4 \
            --existential-buffers 12 \
            --frontier-capacity ${{ matrix.capacity }} \
            --overlap-epsilon-seconds 1.0 \
            --solver-time-limit 35 \
            2>&1 | tee "${output}/run.log"
          status=${PIPESTATUS[0]}
          exit ${status}
      - name: Upload aggregate support frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-existential-support-C${{ matrix.capacity }}
          path: tmp/nyc-existential-support-C${{ matrix.capacity }}
          if-no-files-found: warn
          retention-days: 90
