name: finalize-compact-event-slot-probe

on:
  push:
    branches:
      - compact-event-slot-probe-20260905
    paths:
      - .github/workflows/finalize-compact-event-slot-probe.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compact-event-slot-probe-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r code/ai_pilot/requirements.txt
      - name: Apply conservative default rule and document evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('code/ai_pilot/benchmarks')
          out = root/'results'/'compact_event_slot_audit'
          summary = json.loads((out/'SUMMARY.json').read_text())
          a = summary['variants']['compact_probe']
          b = summary['variants']['probe_disabled']
          e = summary['paired_effects']
          beneficial = (
              e['exact_loss'] == 0
              and e['incumbent_loss'] == 0
              and (e['exact_gain'] > 0 or e['strict_lower_bound_gain'] > 0)
          )

          solver = Path('code/ai_pilot/data_pipeline/production_audit/ordered_run_disclosure_separator.py')
          text = solver.read_text()
          old = '    compact_probe_seconds: float = 0.75\n'
          if old not in text:
              raise SystemExit('unexpected compact-probe default')
          default = 0.75 if beneficial else 0.0
          text = text.replace(old, f'    compact_probe_seconds: float = {default}\n', 1)
          solver.write_text(text)

          decision = {
              'rule': 'default_on iff exact_loss=0, incumbent_loss=0, and exact_gain>0 or strict_lower_bound_gain>0',
              'beneficial_under_rule': beneficial,
              'default_compact_probe_seconds': default,
              'paired_effects': e,
              'compact_variant': a,
              'disabled_variant': b,
              'claim_boundary': summary['claim_boundary'],
          }
          (out/'DEFAULT_DECISION.json').write_text(json.dumps(decision, indent=2, sort_keys=True)+'\n')

          status = 'default-enabled' if beneficial else 'opt-in only'
          note = f'''# Compact event-slot lower-bound probe

The probe asks whether a fixed-support ordered-event world can use at most K
labeled event slots. Its integer model enforces row usage, truthful pair facts,
simultaneous capacity, one core and at least two rows per event, and interval-
union connectivity. The LP relaxation contains every feasible K-event world.

Infeasibility is accepted only when an always-feasible phase-I LP has a strictly
positive lower bound after exact rational dual-residual repair. A MIP solution
can seed a candidate partition, but MIP failure, a solver status, or a partial
search never proves infeasibility. Returned partitions are replayed under the
original ordered-event semantics.

## Frozen paired decision

The predeclared audit compares the same solver with the probe enabled and
disabled. The conservative default rule requires no exact-status or incumbent
loss and at least one exact-status or strict-lower-bound gain. Under the frozen
run the probe is **{status}** (`compact_probe_seconds={default}`).

Paired replicate-level effects:

- exact-status gain/loss: {e['exact_gain']} / {e['exact_loss']};
- incumbent gain/loss: {e['incumbent_gain']} / {e['incumbent_loss']};
- strict lower-bound gain/loss: {e['strict_lower_bound_gain']} / {e['strict_lower_bound_loss']};
- strict gap reduction/increase: {e['strict_gap_reduction']} / {e['strict_gap_increase']}.

Aggregate exact-status closures are {a['exact_status_count']}/{a['run_count']}
with the probe and {b['exact_status_count']}/{b['run_count']} without it.
See `code/ai_pilot/benchmarks/results/compact_event_slot_audit/REPORT.md` and
`DEFAULT_DECISION.json` for the full accounting.

## Scope

This is a synthetic, fixed-support, minimum-event experiment. It does not prove
universal acceleration, real event-membership validity, city-scale performance,
query availability, privacy, or noise robustness. Timing repeats are not
independent worlds. The probe has no effect on the frozen Chicago/NYC evidence
or the paper unless separately integrated.
'''
          Path('docs/COMPACT_EVENT_SLOT_PROBE.md').write_text(note)

          test = Path('code/ai_pilot/data_pipeline/production_audit/tests/test_compact_event_slot_evidence.py')
          test.write_text('''"""Frozen compact event-slot evidence checks."""\nfrom pathlib import Path\nimport subprocess, sys, unittest\n\nclass CompactEventSlotEvidenceTests(unittest.TestCase):\n    def test_frozen_evidence_reconstructs(self):\n        root = Path(__file__).resolve().parents[3] / "benchmarks"\n        subprocess.run([sys.executable, str(root / "check_compact_event_slot_evidence.py")], check=True)\n\nif __name__ == "__main__":\n    unittest.main()\n''')

          manifest = Path('ARTIFACT_MANIFEST.md')
          current = manifest.read_text()
          section = f'''\n\n### Compact event-slot lower-bound probe\n\n- Predeclared protocol: `code/ai_pilot/benchmarks/COMPACT_EVENT_SLOT_PROTOCOL.json`.\n- Frozen records: `code/ai_pilot/benchmarks/results/compact_event_slot_audit/RUNS.json`.\n- Aggregate report and default decision: adjacent `REPORT.md`, `SUMMARY.json`, and `DEFAULT_DECISION.json`.\n- Conservative default outcome: **{status}**.\n- Exact-status closure: {a['exact_status_count']}/{a['run_count']} enabled versus {b['exact_status_count']}/{b['run_count']} disabled; paired gain/loss {e['exact_gain']}/{e['exact_loss']}.\n- This licenses only a synthetic fixed-support lower-bound/probe claim. It does not alter the NYC 14/18 scale lattice or any Chicago result.\n'''
          if '### Compact event-slot lower-bound probe' not in current:
              manifest.write_text(current.rstrip()+section+'\n')

          project = Path('docs/PROJECT_STATUS.md')
          current = project.read_text()
          section = f'''\n\n## Compact event-slot follow-up\n\nA predeclared new-seed paired audit tested a rationally certified at-most-K\nevent-slot relaxation. The frozen conservative rule makes it **{status}**.\nEnabled/disabled exact-status closures are {a['exact_status_count']}/{a['run_count']}\nand {b['exact_status_count']}/{b['run_count']}; paired gains/losses are\n{e['exact_gain']}/{e['exact_loss']}. Full records and negative outcomes remain\nin `benchmarks/results/compact_event_slot_audit/`. This does not change the\npaper or public-city evidence.\n'''
          if '## Compact event-slot follow-up' not in current:
              project.write_text(current.rstrip()+section+'\n')
          PY
      - name: Verify evidence, tests and paper build inputs
        run: |
          python code/ai_pilot/benchmarks/check_compact_event_slot_evidence.py
          python code/ai_pilot/benchmarks/compact_event_slot_audit.py --self-test
          python -m unittest discover -s code/ai_pilot/data_pipeline/production_audit/tests -v
          python -m py_compile \
            code/ai_pilot/data_pipeline/production_audit/compact_event_slot_probe.py \
            code/ai_pilot/data_pipeline/production_audit/ordered_run_disclosure_separator.py
      - name: Commit final evidence and remove finalizer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finalize-compact-event-slot-probe.yml
          git add \
            ARTIFACT_MANIFEST.md \
            docs/PROJECT_STATUS.md \
            docs/COMPACT_EVENT_SLOT_PROBE.md \
            code/ai_pilot/data_pipeline/production_audit/ordered_run_disclosure_separator.py \
            code/ai_pilot/data_pipeline/production_audit/tests/test_compact_event_slot_evidence.py \
            code/ai_pilot/benchmarks/results/compact_event_slot_audit/DEFAULT_DECISION.json
          git commit -m "Finalize compact event-slot probe with conservative default"
          git push origin HEAD:compact-event-slot-probe-20260905
