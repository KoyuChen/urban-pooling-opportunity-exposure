name: nyc-hvfhv-existential-panel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_existential_support_frontier.py
      - code/ai_pilot/data_pipeline/production_audit/aggregate_nyc_existential_panel.py
      - code/ai_pilot/data_pipeline/production_audit/NYC_EXISTENTIAL_PANEL_PROTOCOL.md
      - .github/workflows/nyc-hvfhv-existential-panel.yml

concurrency:
  group: nyc-hvfhv-existential-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Test support frontier and panel aggregation
        run: |
          python code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_existential_support_frontier.py --self-test
          python code/ai_pilot/data_pipeline/production_audit/aggregate_nyc_existential_panel.py --self-test

  cell:
    needs: unit
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        capacity: [2, 3, 4]
        window:
          - label: jan_weekday_am
            start: 2023-01-03T06:00:00
            end: 2023-01-03T10:00:00
          - label: jan_weekday_pm
            start: 2023-01-03T17:00:00
            end: 2023-01-03T21:00:00
          - label: jan_weekend_pm
            start: 2023-01-07T18:00:00
            end: 2023-01-07T22:00:00
          - label: apr_weekday_pm
            start: 2023-04-04T17:00:00
            end: 2023-04-04T21:00:00
          - label: jul_weekday_pm
            start: 2023-07-05T17:00:00
            end: 2023-07-05T21:00:00
          - label: oct_weekday_pm
            start: 2023-10-03T17:00:00
            end: 2023-10-03T21:00:00
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Build one panel cell
        shell: bash
        run: |
          output="tmp/nyc-existential-panel/${{ matrix.window.label }}/C${{ matrix.capacity }}"
          mkdir -p "${output}"
          cat > "${output}/panel_cell.json" <<EOF
          {
            "window_label": "${{ matrix.window.label }}",
            "scan_start": "${{ matrix.window.start }}",
            "scan_end": "${{ matrix.window.end }}",
            "capacity": ${{ matrix.capacity }},
            "source_commit": "${GITHUB_SHA}"
          }
          EOF
          set +e
          python code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_existential_support_frontier.py \
            --output-dir "${output}" \
            --scan-start "${{ matrix.window.start }}" \
            --scan-end "${{ matrix.window.end }}" \
            --scan-window-hours 1 \
            --existential-core 4 \
            --existential-buffers 12 \
            --frontier-capacity ${{ matrix.capacity }} \
            --overlap-epsilon-seconds 1.0 \
            --solver-time-limit 30 \
            2>&1 | tee "${output}/run.log"
          status=${PIPESTATUS[0]}
          python - <<PY
          import json
          from pathlib import Path
          path = Path("${output}/panel_cell.json")
          payload = json.loads(path.read_text())
          payload["process_exit_status"] = ${status}
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\\n")
          PY
          exit ${status}
      - name: Upload panel cell
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-existential-panel-${{ matrix.window.label }}-C${{ matrix.capacity }}
          path: tmp/nyc-existential-panel/${{ matrix.window.label }}/C${{ matrix.capacity }}
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    if: ${{ always() && needs.unit.result == 'success' }}
    needs: [unit, cell]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download panel cells
        uses: actions/download-artifact@v4
        with:
          pattern: nyc-existential-panel-*
          path: tmp/nyc-existential-panel-downloads
      - name: Aggregate and audit panel
        shell: bash
        run: |
          mkdir -p tmp/nyc-existential-panel-summary
          set +e
          python code/ai_pilot/data_pipeline/production_audit/aggregate_nyc_existential_panel.py \
            --input-dir tmp/nyc-existential-panel-downloads \
            --output-dir tmp/nyc-existential-panel-summary \
            2>&1 | tee tmp/nyc-existential-panel-summary/run.log
          status=${PIPESTATUS[0]}
          exit ${status}
      - name: Upload panel summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-existential-panel-summary
          path: tmp/nyc-existential-panel-summary
          if-no-files-found: warn
          retention-days: 90
