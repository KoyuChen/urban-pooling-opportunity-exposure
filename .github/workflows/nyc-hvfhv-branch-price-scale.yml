name: nyc-hvfhv-branch-price-scale

# Push-path filtering keeps this expensive lattice from restarting on ordinary
# paper edits. Manual dispatch remains available for an explicit rerun.
on:
  workflow_dispatch:
  push:
    branches:
      - real-data-smoke-20260901
    paths:
      - code/ai_pilot/data_pipeline/production_audit/run_nyc_branch_price_scale.py
      - code/ai_pilot/data_pipeline/production_audit/aggregate_nyc_branch_price_scale.py
      - code/ai_pilot/data_pipeline/production_audit/NYC_BRANCH_PRICE_SCALE_PROTOCOL.md
      - code/ai_pilot/data_pipeline/production_audit/ordered_run_branch_and_price.py
      - code/ai_pilot/data_pipeline/production_audit/ordered_run_column_generation.py
      - code/ai_pilot/data_pipeline/production_audit/ordered_run_interval_oracle.py
      - code/ai_pilot/data_pipeline/production_audit/live_nyc_hvfhv_branch_and_price_scale.py
      - .github/workflows/nyc-hvfhv-branch-price-scale.yml

concurrency:
  group: nyc-hvfhv-branch-price-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Test scaling driver and aggregator
        run: |
          python code/ai_pilot/data_pipeline/production_audit/run_nyc_branch_price_scale.py --self-test \
            --window-label self-test \
            --scan-start 2023-01-03T17:00:00 \
            --scan-end 2023-01-03T21:00:00 \
            --ordered-core 4 \
            --solver-time-limit 30
          python code/ai_pilot/data_pipeline/production_audit/aggregate_nyc_branch_price_scale.py --self-test

  cell:
    needs: unit
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {label: jan_weekday_pm_n4, core: 4, limit: 60}
          - {label: jan_weekday_pm_n8, core: 8, limit: 180}
          - {label: jan_weekday_pm_n12, core: 12, limit: 360}
          - {label: jan_weekday_pm_n16, core: 16, limit: 600}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Run exact integer scaling cell
        shell: bash
        run: |
          output="tmp/nyc-branch-price-scale/${{ matrix.label }}"
          mkdir -p "${output}"
          set +e
          timeout --signal=TERM --kill-after=30s 2100s \
            python code/ai_pilot/data_pipeline/production_audit/run_nyc_branch_price_scale.py \
              --output-dir "${output}" \
              --window-label "${{ matrix.label }}" \
              --scan-start 2023-01-03T17:00:00 \
              --scan-end 2023-01-03T21:00:00 \
              --ordered-core "${{ matrix.core }}" \
              --solver-time-limit "${{ matrix.limit }}" \
              2>&1 | tee "${output}/run.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ ${status} -eq 124 || ${status} -eq 137 || ${status} -eq 143 ]]; then
            python - <<PY
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("${output}/driver_manifest.json")
          payload = json.loads(path.read_text()) if path.exists() else {
              "report_version": "nyc-branch-price-scale-driver/v2-single-target",
              "window_label": "${{ matrix.label }}",
              "ordered_core": ${{ matrix.core }},
              "ordered_buffers": $((3 * ${{ matrix.core }})),
              "solver_time_limit_per_capacity": ${{ matrix.limit }}
          }
          payload.update({
              "status": "WORKFLOW_TIMEOUT_UNRESOLVED",
              "process_exit_status": ${status},
              "finished_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          })
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
            exit 0
          fi
          exit ${status}
      - name: Upload scaling cell
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-branch-price-scale-${{ matrix.label }}
          path: tmp/nyc-branch-price-scale/${{ matrix.label }}
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    if: ${{ always() && needs.unit.result == 'success' }}
    needs: [unit, cell]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download scaling cells
        uses: actions/download-artifact@v4
        with:
          pattern: nyc-branch-price-scale-jan_*
          path: tmp/nyc-branch-price-scale-downloads
      - name: Aggregate without coercing unresolved cells
        run: |
          mkdir -p tmp/nyc-branch-price-scale-summary
          python code/ai_pilot/data_pipeline/production_audit/aggregate_nyc_branch_price_scale.py \
            --input-dir tmp/nyc-branch-price-scale-downloads \
            --output-dir tmp/nyc-branch-price-scale-summary \
            --expected-driver-count 4
      - name: Upload scaling summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-branch-price-scale-summary
          path: tmp/nyc-branch-price-scale-summary
          if-no-files-found: warn
          retention-days: 90
