name: verify-and-mark-compact-probe

on:
  push:
    branches:
      - compact-event-slot-probe-20260905
    paths:
      - .github/workflows/verify-and-mark-compact-probe.yml

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compact-event-slot-probe-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r code/ai_pilot/requirements.txt
      - name: Run complete deterministic verification
        run: |
          python -m py_compile \
            code/ai_pilot/data_pipeline/production_audit/compact_event_slot_probe.py \
            code/ai_pilot/data_pipeline/production_audit/ordered_run_disclosure_separator.py \
            code/ai_pilot/benchmarks/compact_event_slot_audit.py
          python -m unittest discover -s code/ai_pilot/data_pipeline/production_audit/tests -v
          python code/ai_pilot/benchmarks/event_frontier_truth_benchmark_scale.py --self-test
          python code/ai_pilot/benchmarks/selective_disclosure_benchmark.py --self-test
          python code/ai_pilot/benchmarks/selective_disclosure_constraint_generation.py --self-test
          python code/ai_pilot/benchmarks/compact_event_slot_audit.py --self-test
          python code/ai_pilot/benchmarks/check_compact_event_slot_evidence.py

  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compact-event-slot-probe-20260905
      - name: Compile ACM paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Check KDD page boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          ./scripts/check_submission_pdf.sh paper/main.pdf

  mark:
    needs: [tests, paper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compact-event-slot-probe-20260905
          fetch-depth: 0
      - name: Record gate and remove temporary workflow
        run: |
          cat > docs/COMPACT_PROBE_CI_PASS.md <<EOF
          # Compact probe integration gate

          The temporary verification workflow completed both the full deterministic
          test job and the ACM/KDD paper build before this marker was committed.

          Tested workflow source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}

          This marker certifies CI execution only; scientific claims remain bounded
          by the frozen audit report and claim-boundary documents.
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/verify-and-mark-compact-probe.yml
          git add docs/COMPACT_PROBE_CI_PASS.md
          git commit -m "Record compact probe full integration gate"
          git push origin HEAD:compact-event-slot-probe-20260905
