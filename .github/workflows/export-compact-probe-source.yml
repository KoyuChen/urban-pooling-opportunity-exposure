name: export-compact-probe-source

on:
  push:
    branches:
      - compact-event-slot-probe-20260905
    paths:
      - .github/workflows/export-compact-probe-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked source
        run: git archive --format=zip --output="$RUNNER_TEMP/compact-probe-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: compact-probe-source
          path: ${{ runner.temp }}/compact-probe-source.zip
          retention-days: 7
