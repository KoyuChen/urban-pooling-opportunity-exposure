name: export-source-checkpoint
on:
  push:
    branches: [explore-selective-disclosure-20260904]
    paths: [.github/workflows/export-source-checkpoint.yml]
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output "$RUNNER_TEMP/eventfrontier-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: eventfrontier-source-checkpoint
          path: ${{ runner.temp }}/eventfrontier-source.zip
          retention-days: 7
