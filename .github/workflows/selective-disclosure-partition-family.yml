name: selective-disclosure-partition-family

on:
  push:
    branches:
      - explore-selective-disclosure-20260904
    paths:
      - .github/workflows/selective-disclosure-partition-family.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_pilot/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r code/ai_pilot/requirements.txt
      - name: Verify all-partitions certificate formulas
        run: |
          python code/ai_pilot/benchmarks/selective_disclosure_partition_family.py \
            --max-exact-n 7 \
            --output-dir tmp/selective-disclosure-partition-family
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path("tmp/selective-disclosure-partition-family/report.json")
              .read_text(encoding="utf-8")
          )
          assert report["design"]["max_exact_n"] == 7
          assert report["verified_cell_count"] == 112
          assert report["full_recovery_formula"] == "n-K+binom(K,2)"
          assert report["decision_formula"]["K_gt_k"] == "binom(k+1,2)"
          PY
      - name: Upload aggregate theorem audit
        uses: actions/upload-artifact@v4
        with:
          name: selective-disclosure-partition-family
          path: tmp/selective-disclosure-partition-family
          retention-days: 90
